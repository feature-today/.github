name: Reusable — Security audit

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      pnpm-version:
        type: string
        default: "11"
      working-directory:
        type: string
        default: "."
      audit-level:
        description: Minimum severity that fails the job (low|moderate|high|critical)
        type: string
        default: high

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit + OSV
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=${{ inputs.audit-level }} --prod

      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |
            --recursive
            --lockfile=${{ inputs.working-directory }}/pnpm-lock.yaml
        continue-on-error: true
